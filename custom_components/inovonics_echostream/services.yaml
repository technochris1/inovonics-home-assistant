set_coordinator_nid:
  name: Set coordinator NID
  description: Change the coordinator network ID and verify it through readback. This can interrupt repeater traffic.
  fields:
    nid:
      name: Network ID
      description: "0 uses broadcast mode. 1–31 use directed mode."
      required: true
      selector:
        number:
          min: 0
          max: 31
          mode: box
    confirm:
      name: Confirm coordinator change
      description: Confirm that you are ready to reconfigure the coordinator and its repeaters.
      required: true
      selector:
        boolean:
sync_repeater_nid:
  name: Apply coordinator NID to a repeater
  description: Apply the current coordinator NID to a heard repeater. A matching reset report confirms the update.
  fields:
    uid:
      name: Repeater UID
      required: true
      selector:
        text:
    nid:
      name: Expected coordinator NID
      description: Enter the coordinator NID currently displayed by the integration.
      required: true
      selector:
        number:
          min: 0
          max: 31
          mode: box
set_device_offline_timeout:
  name: Set device offline timeout
  description: Override an endpoint or repeater offline window. Omit minutes to use its default.
  fields:
    uid:
      name: Device UID
      required: true
      selector:
        text:
    minutes:
      name: Minutes
      description: Use 0 to disable monitoring for this device.
      selector:
        number:
          min: 0
          max: 10080
          mode: box
